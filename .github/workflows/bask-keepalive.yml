# Free Supabase projects pause after about a week with no API traffic. This
# makes one tiny read every few days so Bask keeps working between play
# weeks. It uses the same public key the Bask page already ships with.
name: Bask keep-alive

on:
  schedule:
    - cron: '17 9 */3 * *'   # every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Bask database
        run: |
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            "https://sslgpzbipiuvcdpnerjv.supabase.co/rest/v1/bask_sessions?select=code&limit=1" \
            -H "apikey: sb_publishable_4lsrfWv0HKecgRGCnlo0ZQ_sLLprBOs"
